name: Feature request
description: An option, a setting or a change you'd like.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The shot you need and why the current options don't get you there.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: An option name, an example request, or how another tool does it.
